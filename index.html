<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop MP4 Player with Carousel</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Drag & Drop Zone */
        #drop-zone {
            width: 100%; max-width: 800px; height: 100px; 
            border: 2px dashed #555; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            background-color: #1e1e1e; cursor: pointer; transition: 0.3s;
            margin-bottom: 20px; text-align: center;
        }
        #drop-zone.dragover { background-color: #333; border-color: #4CAF50; }
        #drop-zone p { pointer-events: none; margin: 0; font-size: 16px; color: #aaa; }
        
        /* Video Player */
        .video-container { width: 100%; max-width: 800px; background: #000; position: relative; }
        video { width: 100%; display: block; outline: none; }
        
        /* Speed UI Overlay */
        .speed-indicator {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8);
            padding: 8px 12px; border-radius: 5px; font-weight: bold; font-family: monospace;
            font-size: 16px; display: none; transition: opacity 0.2s; pointer-events: none;
        }
        
        /* Carousel / Playlist */
        .carousel-wrapper {
            width: 100%; max-width: 800px; margin-top: 15px; 
            display: flex; align-items: center; gap: 10px;
        }
        .carousel-btn {
            background: #333; color: white; border: none; padding: 15px;
            cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.2s;
        }
        .carousel-btn:hover { background: #555; }
        
        .carousel {
            display: flex; overflow-x: auto; gap: 10px; padding: 10px 0;
            flex-grow: 1; scroll-behavior: smooth;
        }
        .carousel::-webkit-scrollbar { height: 8px; }
        .carousel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .carousel-item {
            background: #222; border: 1px solid #444; border-radius: 6px;
            padding: 12px; min-width: 120px; max-width: 150px; cursor: pointer;
            text-align: center; font-size: 13px; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; transition: 0.2s; user-select: none;
        }
        .carousel-item:hover { background: #333; }
        .carousel-item.active { border-color: #4CAF50; background: #2a3b2a; }
        
        /* Controls Guide */
        .controls-help {
            max-width: 800px; width: 100%; margin-top: 20px; padding: 15px; 
            background: #1e1e1e; border-radius: 8px; font-size: 14px; color: #bbb;
            box-sizing: border-box;
        }
        .key { background: #444; color: #fff; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold;}
    </style>
</head>
<body>

    <div id="drop-zone">
        <p>Drag & Drop MP4 files here (or click to browse)</p>
        <!-- Hidden file input as a fallback if the user decides to click instead of drag -->
        <input type="file" id="file-input" accept="video/*" multiple style="display: none;">
    </div>

    <div class="video-container">
        <video id="video-player" controls></video>
        <div class="speed-indicator" id="speed-indicator">1.00x</div>
    </div>

    <div class="carousel-wrapper">
        <button class="carousel-btn" id="prev-btn">◀</button>
        <div class="carousel" id="carousel">
            <!-- Dynamically populated files go here -->
        </div>
        <button class="carousel-btn" id="next-btn">▶</button>
    </div>

    <div class="controls-help">
        <strong>Keyboard Controls:</strong><br><br>
        <span class="key">J</span> : Decrease Speed (Minimum 0.25x)<br>
        <span class="key">K</span> : Play / Pause (Resets speed to 1.00x on play)<br>
        <span class="key">L</span> : Increase Speed (Adds 0.25x)
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const videoPlayer = document.getElementById('video-player');
        const carousel = document.getElementById('carousel');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const speedIndicator = document.getElementById('speed-indicator');
        
        let playlist = [];
        let currentIndex = -1;
        let speedTimeout;

        // --- 1. DRAG AND DROP HANDLING ---
        dropZone.addEventListener('click', () => fileInput.click());
        
        // Prevent default browser behavior (opening the file instead of dropping it)
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone on drag hover
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(file => file.type.startsWith('video/'));
            if (newFiles.length === 0) return;

            playlist = [...playlist, ...newFiles];
            renderCarousel();
            
            // Auto-play the first video if nothing is loaded yet
            if (currentIndex === -1) {
                playVideo(0);
            }
        }

        // --- 2. CAROUSEL & PLAYLIST LOGIC ---
        function renderCarousel() {
            carousel.innerHTML = '';
            playlist.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'carousel-item';
                if (index === currentIndex) item.classList.add('active');
                
                item.textContent = file.name;
                item.title = file.name;
                item.addEventListener('click', () => playVideo(index));
                
                carousel.appendChild(item);
            });
        }

        function playVideo(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            
            const file = playlist[index];
            const fileURL = URL.createObjectURL(file);
            videoPlayer.src = fileURL;
            videoPlayer.playbackRate = 1;
            videoPlayer.play();
            
            renderCarousel();
            
            // Automatically scroll the carousel so the active item is always visible
            const activeItem = carousel.children[index];
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // File navigation buttons
        prevBtn.addEventListener('click', () => playVideo(currentIndex - 1));
        nextBtn.addEventListener('click', () => playVideo(currentIndex + 1));
        
        // Auto-play the next video in the carousel when the current one ends
        videoPlayer.addEventListener('ended', () => {
            playVideo(currentIndex + 1);
        });

        // --- 3. JKL PLAYBACK SPEED CONTROLS ---
        function showSpeed(rate) {
            speedIndicator.textContent = rate.toFixed(2) + 'x';
            speedIndicator.style.display = 'block';
            clearTimeout(speedTimeout);
            speedTimeout = setTimeout(() => {
                speedIndicator.style.display = 'none';
            }, 1000);
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            if (['j', 'k', 'l'].includes(key)) {
                e.preventDefault(); // Prevents standard browser scrolling/focus
                
                let rate = videoPlayer.playbackRate;
                
                if (key === 'k') {
                    if (videoPlayer.paused) {
                        videoPlayer.playbackRate = 1;
                        videoPlayer.play();
                        showSpeed(1);
                    } else {
                        videoPlayer.pause();
                    }
                } 
                else if (key === 'l') {
                    rate += 0.25;
                    videoPlayer.playbackRate = rate;
                    if (videoPlayer.paused) videoPlayer.play();
                    showSpeed(rate);
                } 
                else if (key === 'j') {
                    rate -= 0.25;
                    // Standard browsers freeze or drop frames on negative speeds, so we clamp it to super slow-motion (0.25x) instead of reversing.
                    if (rate < 0.25) rate = 0.25; 
                    videoPlayer.playbackRate = rate;
                    if (videoPlayer.paused) videoPlayer.play();
                    showSpeed(rate);
                }
            }
        });
    </script>
</body>
</html>
